name: Compile Dists (Win, Mac, Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Compiling in  ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Cloning the repo
      uses: actions/checkout@v4

    - name: Configuring Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' 

    - name: Instaling dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compiling the executable with PyInstaller
      run: pyinstaller OpenStudioHub.spec

    - name: Uploading the executable
      uses: actions/upload-artifact@v4
      with:
        name: OpenStudioHub-${{ runner.os }}
        path: dist/*
        retention-days: 7
